version: "3.9"

services:
  zookeeper:
    image: docker.io/bitnamilegacy/zookeeper:3.8
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    networks:
      - kafka-network

  kafka-0:
    image: docker.io/bitnamilegacy/kafka:3.4
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-0:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_MIN_IN_SYNC_REPLICAS=1
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_BROKER_ID=0
    volumes:
      - kafka_0_data:/bitnami/kafka
    depends_on:
      - zookeeper
    networks:
      - kafka-network

  ksqldb-server:
    image: docker.io/confluentinc/ksqldb-server:latest
    depends_on:
      - kafka-0
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka-0:9094
      KSQL_LISTENERS: http://0.0.0.0:8088
    ports:
      - "127.0.0.1:8088:8088"
    networks:
      - kafka-network

  ksqldb-cli:
    image: docker.io/confluentinc/ksqldb-cli:latest
    depends_on:
      - ksqldb-server
    entrypoint: /bin/sh -c 'exec ksql http://ksqldb-server:8088'
    stdin_open: true
    tty: true
    networks:
      - kafka-network

networks:
  kafka-network:

volumes:
  zookeeper_data:
  kafka_0_data:
